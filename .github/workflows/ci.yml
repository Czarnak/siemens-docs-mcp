name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Verify imports resolve
        run: python -c "from scraper.client import FluidtopicsClient; from scraper.toc import parse_toc; from scraper.converter import html_to_markdown; print('All imports OK')"

      - name: Smoke test CLI help
        run: python main.py --help
